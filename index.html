<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.json">
  <title>Sarracuda Full Configurator</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    button { padding: 10px 20px; font-size: 16px; margin-bottom: 20px; cursor: pointer; border-radius: 5px; border: none; background: #00e676; font-weight: bold; }
    .controls { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: inline-block; text-align: left; min-width: 280px; }
    .controls label { display: block; margin-bottom: 8px; cursor: pointer; }
    .slider-container { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: inline-block; width: 320px; text-align: left; }
    .slider-container label { font-weight: bold; }
    input[type="range"] { width: 100%; margin-top: 10px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(5, 110px); gap: 15px; justify-content: center; }
    .card { background: #222; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card label { display: block; font-size: 11px; margin-top: 6px; }
    input[type="number"] { width: 50px; text-align: center; }
    input[type="color"] { border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: none; }
    .color-group { display: flex; justify-content: space-around; align-items: center; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Sarracuda Studio Configurator</h1>
  <button id="connectBtn">Connect via Bluetooth</button>

  <br>

  <div class="controls">
    <strong>LED Base Mode:</strong><br><br>
    <label><input type="radio" name="baseMode" value="0" id="baseMode0" onchange="setMode(0)" checked> On Press Only (Idle Off)</label>
    <label><input type="radio" name="baseMode" value="1" id="baseMode1" onchange="setMode(1)"> Idle + Press Color</label>
    
    <br>
    <strong>Color Style Sub-Option:</strong><br><br>
    <label><input type="radio" name="subStyle" value="none" id="subStyleNone" onchange="setSubOption('none')" checked> Custom Colors</label>
    <label><input type="radio" name="subStyle" value="note" id="subStyleNote" onchange="setSubOption('note')"> Color By Note Spectrum</label>
    <label><input type="radio" name="subStyle" value="rainbow" id="subStyleRainbow" onchange="setSubOption('rainbow')"> Rainbow Wave Animation</label>
  </div>

  <br>

  <div class="slider-container">
    <label for="brightnessSlider">Brightness: <span id="brightnessVal">24%</span></label>
    <input type="range" id="brightnessSlider" min="0" max="255" value="60" oninput="updateBrightness(this.value)">
  </div>

  <div class="grid" id="matrixGrid"></div>

  <script>
    let bluetoothDevice;
    let configCharacteristic;

    // Both 16-bit and 128-bit fallback formats for 0x1234 & 0x5678
    const SERVICE_UUID_16  = 0x1234;
    const SERVICE_UUID_128 = '00001234-0000-1000-8000-00805f9b34fb';
    
    const CHAR_UUID_16     = 0x5678;
    const CHAR_UUID_128    = '00005678-0000-1000-8000-00805f9b34fb';

    const gridContainer = document.getElementById('matrixGrid');

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    for (let i = 0; i < 15; i++) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <strong>Pad ${i + 1}</strong>
        <label>MIDI Note</label>
        <input type="number" id="note-${i}" value="${60 + i}" min="0" max="127" onchange="updatePad(${i})">
        
        <div class="color-group">
          <div>
            <label>Idle</label>
            <input type="color" id="idle-${i}" value="#ff1493" onchange="updatePad(${i})">
          </div>
          <div>
            <label>Press</label>
            <input type="color" id="active-${i}" value="#00ff00" onchange="updatePad(${i})">
          </div>
        </div>
      `;
      gridContainer.appendChild(card);
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        // Request device by name rather than service UUID filter
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Sarracuda' }],
          optionalServices: [SERVICE_UUID_16, SERVICE_UUID_128, '0000180e-0000-1000-8000-00805f9b34fb']
        });

        const server = await bluetoothDevice.gatt.connect();

        // Attempt to resolve service via 16-bit first, fallback to 128-bit
        let service;
        try {
          service = await server.getPrimaryService(SERVICE_UUID_16);
        } catch (e) {
          service = await server.getPrimaryService(SERVICE_UUID_128);
        }

        // Attempt to resolve characteristic via 16-bit first, fallback to 128-bit
        try {
          configCharacteristic = await service.getCharacteristic(CHAR_UUID_16);
        } catch (e) {
          configCharacteristic = await service.getCharacteristic(CHAR_UUID_128);
        }

        document.getElementById('connectBtn').style.background = '#00b0ff';
        document.getElementById('connectBtn').innerText = 'Syncing...';

        await syncSettingsFromDevice();

        document.getElementById('connectBtn').innerText = 'Connected & Synced!';
      } catch (error) {
        console.error(error);
        alert('Connection failed: ' + error.message);
        document.getElementById('connectBtn').style.background = '#00e676';
        document.getElementById('connectBtn').innerText = 'Connect via Bluetooth';
      }
    });

    async function syncSettingsFromDevice() {
      if (!configCharacteristic) return;

      const DataView = await configCharacteristic.readValue();
      let offset = 0;

      offset += 4; // Skip magic bytes

      for (let i = 0; i < 15; i++) {
        const note = DataView.getUint8(offset++);
        document.getElementById(`note-${i}`).value = note;
      }

      const ledMode = DataView.getUint8(offset++);
      if (ledMode === 0) document.getElementById('baseMode0').checked = true;
      else document.getElementById('baseMode1').checked = true;

      const rainbowSubOption = DataView.getUint8(offset++) === 1;
      const colorByNoteSubOption = DataView.getUint8(offset++) === 1;

      if (rainbowSubOption) {
        document.getElementById('subStyleRainbow').checked = true;
      } else if (colorByNoteSubOption) {
        document.getElementById('subStyleNote').checked = true;
      } else {
        document.getElementById('subStyleNone').checked = true;
      }

      const brightness = DataView.getUint8(offset++);
      document.getElementById('brightnessSlider').value = brightness;
      const pct = Math.round((brightness / 255) * 100);
      document.getElementById('brightnessVal').innerText = `${pct}%`;

      for (let i = 0; i < 15; i++) {
        const r = DataView.getUint8(offset++);
        const g = DataView.getUint8(offset++);
        const b = DataView.getUint8(offset++);
        document.getElementById(`idle-${i}`).value = rgbToHex(r, g, b);
      }

      for (let i = 0; i < 15; i++) {
        const r = DataView.getUint8(offset++);
        const g = DataView.getUint8(offset++);
        const b = DataView.getUint8(offset++);
        document.getElementById(`active-${i}`).value = rgbToHex(r, g, b);
      }
    }

    async function setMode(modeValue) {
      if (!configCharacteristic) return;
      const data = new Uint8Array([0x01, modeValue]);
      await configCharacteristic.writeValueWithoutResponse(data);
    }

    async function setSubOption(type) {
      if (!configCharacteristic) return;

      if (type === 'none') {
        await configCharacteristic.writeValueWithoutResponse(new Uint8Array([0x06, 0x00]));
        await configCharacteristic.writeValueWithoutResponse(new Uint8Array([0x07, 0x00]));
      } else if (type === 'note') {
        await configCharacteristic.writeValueWithoutResponse(new Uint8Array([0x06, 0x00]));
        await configCharacteristic.writeValueWithoutResponse(new Uint8Array([0x07, 0x01]));
      } else if (type === 'rainbow') {
        await configCharacteristic.writeValueWithoutResponse(new Uint8Array([0x07, 0x00]));
        await configCharacteristic.writeValueWithoutResponse(new Uint8Array([0x06, 0x01]));
      }
    }

    async function updatePad(index) {
      if (!configCharacteristic) return;

      const noteVal = parseInt(document.getElementById(`note-${index}`).value);
      
      const idleHex = document.getElementById(`idle-${index}`).value;
      const iR = parseInt(idleHex.substr(1,2), 16);
      const iG = parseInt(idleHex.substr(3,2), 16);
      const iB = parseInt(idleHex.substr(5,2), 16);

      const activeHex = document.getElementById(`active-${index}`).value;
      const aR = parseInt(activeHex.substr(1,2), 16);
      const aG = parseInt(activeHex.substr(3,2), 16);
      const aB = parseInt(activeHex.substr(5,2), 16);

      await configCharacteristic.writeValueWithoutResponse(new Uint8Array([2, index, noteVal]));
      await configCharacteristic.writeValueWithoutResponse(new Uint8Array([4, index, iR, iG, iB, aR, aG, aB]));
    }

    async function updateBrightness(val) {
      const pct = Math.round((val / 255) * 100);
      document.getElementById('brightnessVal').innerText = `${pct}%`;

      if (!configCharacteristic) return;
      const data = new Uint8Array([5, parseInt(val)]);
      await configCharacteristic.writeValueWithoutResponse(data);
    }
  </script>
</body>
</html>
